[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-recover"
version = "0.1.0"
description = "Recover common files from disk images by signature carving"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
drive-recover = "drive_recover.cli:main"

[tool.setuptools.packages.find]
include = ["drive_recover*"]
